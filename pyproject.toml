[project]
name = "code-lens"
version = "0.1.0"
description = "RAG-powered code intelligence — ask questions about any codebase"
readme = "README.md"
authors = [
    { name = "HariTeja" },
]
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=2.7.0",
    "einops>=0.8.0",
    "rank-bm25>=0.2.2",
    "groq>=0.9.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gitpython>=3.1.43",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
]

[tool.uv]
dev-dependencies = []

[project.scripts]
dev = "uvicorn backend.api.main:app --host 0.0.0.0 --port 8000 --reload"
